<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Recipe finder website</title>
  </head>
  <body>
    <header class="navbar"></header>
    <section class="recipe-details">
      <figure class="recipe-visualContent">
        <img src="" alt="" />
      </figure>
      <div class="recipe-content">
        <h1 class="recipe__title"></h1>
        <p class="recipe__description"></p>
        <div class="recipe__cooking-details"></div>
        <div class="ingredient-list">
          <h3></h3>
          <ul class="ingredients">
            <li class="ingredient-item"></li>
          </ul>
        </div>
        <div class="instruction-guide">
          <h3></h3>
          <ol class="instruction">
            <li class="instruction-item"></li>
          </ol>
        </div>
      </div>
    </section>
    <section class="additional-recipes">
      <h2>More Recipes</h2>
      <section class="recipe-cards"></section>
    </section>
    <!-- Populate recipe details using data from the data.json file -->

    <!-- Select three other recipes to display -->

    <footer>
      <span> Made with ❤️ and 🥑 </span>
      <span>
        <img src="../assets/images/icon-tiktok.svg" alt="" />
        <img src="../assets/images/icon-instagram.svg" alt="" />
        <img src="../assets/images/" alt="" />
      </span>
    </footer>
  </body>
</html>
